bio: |
  Haozhe Lei (Graduate Student Member, IEEE) is a Ph.D. candidate in Electrical and Computer Engineering at New York University, advised by [Professor Sundeep Rangan](https://engineering.nyu.edu/faculty/sundeep-rangan) in NYU WIRELESS. He received the B.E. degree in electrical engineering and automation from China Agricultural University in 2019 and the M.S. degree in computer engineering from NYU in 2022. His research develops uncertainty-aware wireless intelligence for embodied autonomy and adaptive 6G systems, combining algorithms, digital twins, and physical testbeds to transform sparse RF and multimodal observations into calibrated spatial beliefs and closed-loop decisions.

  His current work includes MC-CLE and LOCUS-DT for posterior RF localization, PIRL and wireless digital-twin priors for zero-shot robot navigation, MCMB-HDT for closed-loop multi-band handset adaptation, and object-centric graph memory for multimodal spatial reasoning. He also builds FR3/mmWave RFSoC/Pi-Radio channel-sounding systems with TurtleBot4 and Jackal UGV platforms. He received the 2023 Ernst Weber Fellowship from the NYU Tandon School of Engineering.

